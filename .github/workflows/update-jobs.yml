name: تحديث فرص العمل يوميا

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: جلب ملفات الموقع
        uses: actions/checkout@v4

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: تثبيت المكتبات
        run: pip install requests beautifulsoup4

            - name: اختبار الاتصال بموقع ANETI
        run: |
          curl -Iv --connect-timeout 15 https://international.emploi.nat.tn/ || true
          curl -Iv --connect-timeout 15 http://international.emploi.nat.tn/ || true

      - name: حفظ التحديثات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "تحديث عروض الشغل"
          git push
  
